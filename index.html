<title>The Windmill Weekly — Financial Desk</title>
<style>
:root{
  --ink:#111111;
  --ink-2:#333333;
  --muted:#6f6f6f;
  --faint:#9a9a9a;
  --paper:#ffffff;
  --newsprint:#f7f6f3;
  --newsprint-2:#efeee9;
  --rule:#d6d3cc;
  --rule-strong:#111111;
  --loss:#8a1c1c;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sidebar-w:248px;
  --tabbar-h:calc(56px + env(safe-area-inset-bottom));
}
*{box-sizing:border-box;}
html{
  margin:0;padding:0;width:100%;max-width:100%;overflow-x:hidden;
  -webkit-text-size-adjust:100%;text-size-adjust:100%;
  touch-action:manipulation;
}
html,body{margin:0;padding:0;}
body{
  background:var(--newsprint);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
  width:100%;max-width:100%;overflow-x:hidden;
  touch-action:pan-y;
  overscroll-behavior-x:none;
}
#app,.main,.view,.colophon,.topbar,.tabbar{
  max-width:100%;
  min-width:0;
}
#app,.main,.view{overflow-x:hidden;}
@media (display-mode: standalone){
  html,body{background:var(--newsprint);}
  .main{min-height:100dvh;}
}
html.scroll-locked,body.scroll-locked{
  overflow:hidden;
  overscroll-behavior:none;
}
body.scroll-locked{
  position:fixed;left:0;right:0;width:100%;max-width:100%;
}
[hidden]{display:none !important;}
button{font-family:inherit;font-size:inherit;color:inherit;}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink);}
a{color:inherit;}
.rule{height:1px;background:var(--rule);}
.rule.thick{height:3px;background:var(--rule-strong);}
.muted{color:var(--muted);}
.faint{color:var(--faint);}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;}
.neg{color:var(--loss);}
.right{text-align:right;}
.kicker{
  font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);
}
.masthead-title{
  font-family:var(--serif);font-weight:700;font-size:34px;line-height:1.05;
  letter-spacing:-.01em;margin:8px 0;text-align:center;
}
.gate{
  min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:24px;
  padding-top:max(24px, env(safe-area-inset-top));
  padding-right:max(24px, env(safe-area-inset-right));
  padding-bottom:max(24px, env(safe-area-inset-bottom));
  padding-left:max(24px, env(safe-area-inset-left));
  background:var(--newsprint);
}
.gate-paper{
  width:100%;max-width:420px;background:var(--paper);
  border:1px solid var(--rule);padding:28px 26px 22px;
}
.gate-rule{height:1px;background:var(--ink);}
.gate-rule.thick{height:4px;background:var(--ink);margin-bottom:10px;}
.gate-sub{
  text-align:center;margin:0 0 22px;font-family:var(--sans);
  font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);
}
.field{display:block;margin-bottom:14px;}
.field > span{
  display:block;font-size:10px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);margin-bottom:5px;
}
.field input,.field select{
  width:100%;padding:10px 11px;border:1px solid var(--rule);
  background:var(--paper);border-radius:0;
}
.field input:focus,.field select:focus{
  outline:2px solid var(--ink);outline-offset:-2px;border-color:var(--ink);
}
.gate-hint{font-size:12.5px;color:var(--muted);margin:0 0 12px;line-height:1.5;}
.remember{
  display:flex;align-items:flex-start;gap:10px;margin:0 0 14px;
  font-size:13px;color:var(--ink-2);line-height:1.45;cursor:pointer;
  max-width:100%;min-width:0;
}
.remember input{
  width:16px;height:16px;margin:3px 0 0;flex-shrink:0;accent-color:var(--ink);
}
.remember span{min-width:0;overflow-wrap:anywhere;}
.topbar-lock{
  background:none;border:0;cursor:pointer;
  font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink);padding:8px 8px;white-space:nowrap;
}
.gate-error{
  font-size:13px;color:var(--loss);margin:0 0 12px;padding:9px 11px;
  border:1px solid var(--loss);background:#fdf6f6;
}
.gate-foot{
  margin:16px 0 0;text-align:center;font-size:11px;color:var(--faint);
  border-top:1px solid var(--rule);padding-top:12px;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 14px;border:1px solid var(--ink);background:var(--paper);
  cursor:pointer;font-size:12px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;border-radius:0;
}
.btn:hover{background:var(--newsprint-2);}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--ink);color:var(--paper);}
.btn-primary:hover{background:var(--ink-2);}
.btn-block{width:100%;}
.btn-sm{padding:6px 10px;font-size:10.5px;}
.btn-ghost{border-color:var(--rule);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.linkish{
  background:none;border:0;padding:0;cursor:pointer;font-size:12px;
  color:var(--muted);text-decoration:underline;text-underline-offset:2px;
}
.linkish:hover{color:var(--ink);}
.icon-btn{
  background:none;border:0;cursor:pointer;font-size:19px;line-height:1;
  padding:8px 10px;color:var(--ink);
}
.sidebar{
  position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);
  background:var(--paper);border-right:1px solid var(--rule);
  display:flex;flex-direction:column;z-index:40;
  padding-top:env(safe-area-inset-top);
}
.sidebar-masthead{padding:18px 18px 12px;}
.sidebar-title{
  font-family:var(--serif);font-weight:700;font-size:21px;line-height:1.12;
  text-align:center;margin:7px 0;
}
.sidebar-dateline{
  margin-top:9px;text-align:center;font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);
}
.nav{flex:1;overflow-y:auto;padding:6px 0;}
.nav-group{
  padding:14px 18px 5px;font-size:9.5px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);
}
.nav-item{
  display:flex;align-items:baseline;gap:9px;width:100%;
  padding:9px 18px;background:none;border:0;cursor:pointer;text-align:left;
  font-size:13.5px;border-left:3px solid transparent;
}
.nav-item:hover{background:var(--newsprint);}
.nav-item.active{border-left-color:var(--ink);font-weight:700;background:var(--newsprint);}
.nav-item .nav-num{font-family:var(--serif);font-size:10.5px;color:var(--faint);min-width:14px;}
.sidebar-foot{
  padding:12px 18px calc(12px + env(safe-area-inset-bottom));
  border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:8px;
  align-items:flex-start;
}
.main{margin-left:var(--sidebar-w);min-height:100vh;display:flex;flex-direction:column;}
.topbar{display:none;}
.view{flex:1;padding:22px 26px 40px;max-width:1240px;width:100%;}
.colophon{
  padding:16px 26px calc(20px + env(safe-area-inset-bottom));
  border-top:1px solid var(--rule);font-size:10.5px;color:var(--faint);line-height:1.6;
}
.page-head{border-bottom:3px solid var(--ink);padding-bottom:9px;margin-bottom:18px;min-width:0;max-width:100%;}
.page-head h1,.page-head .dateline{overflow-wrap:anywhere;max-width:100%;}
.page-head h1{
  font-family:var(--serif);font-size:29px;font-weight:700;margin:3px 0 0;
  letter-spacing:-.01em;line-height:1.1;
}
.page-head .dateline{
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
}
.page-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px;}
.section{margin:26px 0 0;}
.section-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  flex-wrap:wrap;min-width:0;
  border-bottom:1px solid var(--ink);padding-bottom:5px;margin-bottom:12px;
}
.section-head h2,.section-head .aside{min-width:0;overflow-wrap:anywhere;}
.section-head h2{
  font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;margin:0;
}
.section-head .aside{font-size:11px;color:var(--muted);}
.figures{
  display:flex;flex-wrap:wrap;
  border-top:1px solid var(--rule);border-left:1px solid var(--rule);
  background:var(--paper);
  max-width:100%;min-width:0;
}
.figure{
  flex:1 1 178px;
  border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);
  padding:14px 15px;min-width:0;max-width:100%;
  overflow-wrap:anywhere;
}
.figure .label{
  font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);margin-bottom:6px;
}
.figure .value{
  font-family:var(--serif);font-size:28px;font-weight:700;line-height:1.05;
  letter-spacing:-.02em;font-variant-numeric:tabular-nums;
}
.figure .value.sm{font-size:22px;}
.figure .sub{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.4;}
.figure.lead{flex:1 1 100%;}
.cancel-amt{display:flex;flex-direction:column;align-items:flex-end;gap:1px;min-width:0;max-width:100%;}
.cancel-amt .primary,.cancel-amt .secondary{max-width:100%;overflow-wrap:anywhere;}
.figure.lead .value{font-size:38px;}
.month-rev{margin:22px 0 4px;max-width:100%;min-width:0;}
.month-rev-note{margin:0 0 12px;font-size:13px;color:var(--ink-2);line-height:1.55;max-width:46em;overflow-wrap:anywhere;}
.month-rev .chart-wrap{max-width:100%;min-width:0;overflow:hidden;}
.month-rev-chart{width:100%;max-width:100%;height:auto;display:block;}
.chart-bar-val{font-size:10px;fill:var(--ink);font-family:var(--sans);font-variant-numeric:tabular-nums;}
.rev-col{cursor:pointer;}
.rev-col:focus{outline:none;}
.rev-col:focus .rev-hit,.rev-col:hover .rev-hit{fill:#efeee9;}
.rev-bar{fill:var(--ink);}
.rev-col.selected .rev-bar{stroke:var(--ink);stroke-width:1.2;}
.rev-col.selected .rev-month{font-weight:700;fill:var(--ink);}
.rev-underline{stroke:var(--ink);stroke-width:0;}
.rev-col.selected .rev-underline{stroke-width:2;}
.month-rev-readout{
  margin:10px 0 0;padding:11px 13px;background:var(--paper);border:1px solid var(--rule);
  font-family:var(--serif);font-size:18px;font-weight:700;line-height:1.35;
  overflow-wrap:anywhere;min-width:0;max-width:100%;
}
.card{background:var(--paper);border:1px solid var(--rule);}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;}
table.data{width:100%;max-width:100%;border-collapse:collapse;background:var(--paper);font-size:13px;}
table.data th{
  text-align:left;font-size:9.5px;font-weight:700;letter-spacing:.11em;
  text-transform:uppercase;color:var(--muted);padding:8px 11px;
  border-bottom:1px solid var(--ink);white-space:nowrap;
}
table.data th.sort{cursor:pointer;user-select:none;}
table.data th.sort:hover{color:var(--ink);}
table.data td{padding:9px 11px;border-bottom:1px solid var(--rule);vertical-align:top;}
table.data tr:last-child td{border-bottom:0;}
table.data tbody tr:hover{background:var(--newsprint);}
table.data td.num,table.data th.num{text-align:right;font-variant-numeric:tabular-nums;}
table.data tr.total td{
  border-top:2px solid var(--ink);border-bottom:0;font-weight:700;background:var(--newsprint);
}
table.data .primary{font-weight:600;}
table.data .secondary{font-size:11.5px;color:var(--muted);}
.tag{
  display:inline-block;font-size:9px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;padding:2px 6px;border:1px solid var(--ink);
  white-space:nowrap;line-height:1.5;
}
.tag.solid{background:var(--ink);color:var(--paper);}
.tag.muted{border-color:var(--rule);color:var(--muted);}
.tag.warn{border-color:var(--loss);color:var(--loss);}
.banner{
  border:1px solid var(--ink);background:var(--paper);
  padding:12px 15px;margin:0 0 16px;display:flex;gap:12px;align-items:flex-start;
}
.banner .banner-mark{
  font-family:var(--serif);font-weight:700;font-size:16px;line-height:1.2;
  border-right:1px solid var(--rule);padding-right:12px;
}
.banner .banner-body{flex:1;min-width:0;}
.banner h3{
  font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  margin:0 0 4px;
}
.banner p{margin:0;font-size:12.5px;line-height:1.55;color:var(--ink-2);}
.banner.alert{border-color:var(--loss);}
.banner.alert h3{color:var(--loss);}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:10.5px;color:var(--muted);margin-top:10px;}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.swatch{width:11px;height:11px;border:1px solid var(--ink);display:inline-block;}
.swatch.solid{background:var(--ink);}
.swatch.hatch{background:repeating-linear-gradient(45deg,var(--ink),var(--ink) 2px,var(--paper) 2px,var(--paper) 5px);}
.swatch.mark{background:var(--paper);position:relative;}
.swatch.mark::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;border-left:2px solid var(--loss);}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.chip{
  padding:5px 11px;border:1px solid var(--rule);background:var(--paper);cursor:pointer;
  font-size:12px;letter-spacing:.04em;
}
.chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600;}
select.chip,input.chip{padding:5px 8px;font-size:16px;}
button.chip{padding:5px 11px;font-size:12px;}
input.search{
  min-width:200px;flex:1;padding:8px 10px;border:1px solid var(--rule);background:var(--paper);
}
.checks{background:var(--paper);border:1px solid var(--rule);}
.check{display:flex;gap:12px;padding:11px 14px;border-bottom:1px solid var(--rule);align-items:flex-start;}
.check:last-child{border-bottom:0;}
.check .mark{font-family:var(--serif);font-weight:700;min-width:1.1em;}
.check .meta{font-size:11.5px;color:var(--muted);margin-top:2px;}
.prose{font-size:13.5px;line-height:1.65;color:var(--ink-2);max-width:46em;}
.prose p{margin:0 0 10px;}
.list{margin:0;padding:0 0 0 18px;}
.list li{margin:0 0 8px;line-height:1.55;}

.cancel-box{
  margin:16px 0 0;border:1px solid var(--rule);background:var(--paper);
  max-width:100%;min-width:0;overflow:hidden;
}
.cancel-head{
  display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  padding:8px 12px 7px;border-bottom:1px solid var(--rule);
}
.cancel-head h2{
  font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;margin:0;min-width:0;overflow-wrap:anywhere;
}
.cancel-head .aside{font-size:11px;color:var(--muted);min-width:0;overflow-wrap:anywhere;text-align:right;}
.cancel-counts{
  padding:7px 12px 8px;border-bottom:1px solid var(--rule);
  font-size:12.5px;line-height:1.45;color:var(--ink-2);
  overflow-wrap:anywhere;min-width:0;max-width:100%;
}
.cancel-counts strong{color:var(--ink);font-variant-numeric:tabular-nums;}
.cancel-row{
  display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr) minmax(0,1.35fr) minmax(0,.95fr);
  gap:4px 10px;padding:6px 12px;border-bottom:1px solid var(--rule);
  font-size:12.5px;line-height:1.35;max-width:100%;min-width:0;
}
.cancel-row > *{min-width:0;overflow-wrap:anywhere;}
.cancel-row .name{font-weight:600;}
.cancel-row .date,.cancel-row .plan{color:var(--ink-2);font-size:12px;}
.cancel-row .amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink);}
.cancel-more{
  display:block;width:100%;border:0;background:var(--paper);padding:7px 12px;
  text-align:left;cursor:pointer;font-size:10.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);
}
.cancel-more:hover,.cancel-more:focus{color:var(--ink);outline:none;}
@media (max-width:640px){
  .cancel-row{
    grid-template-columns:minmax(0,1fr) auto;
    gap:1px 10px;padding:7px 12px;
  }
  .cancel-row .name{grid-column:1;grid-row:1;}
  .cancel-row .amt{grid-column:2;grid-row:1;text-align:right;align-self:start;}
  .cancel-row .date,.cancel-row .plan{grid-column:1 / -1;grid-row:auto;font-size:11.5px;}
}

.chart-wrap{background:var(--paper);border:1px solid var(--rule);padding:10px 10px 6px;overflow-x:hidden;max-width:100%;}
.chart{width:100%;max-width:100%;height:auto;display:block;min-width:0;}
.chart-tick{font-size:10px;fill:var(--muted);font-family:var(--sans);}
.chart-axis{font-size:10px;fill:var(--muted);font-family:var(--sans);}
.cal-grid{
  display:grid;grid-template-columns:repeat(7,minmax(0,1fr));
  border-left:1px solid var(--rule);border-top:1px solid var(--rule);background:var(--paper);
  width:100%;max-width:100%;min-width:0;
}
.cal-dow{
  padding:6px 4px;text-align:center;font-size:9px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);border-right:1px solid var(--rule);
  border-bottom:1px solid var(--ink);
}
.cal-dow,.cal-day{min-width:0;max-width:100%;overflow:hidden;}
.cal-day{
  min-height:96px;border:0;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);
  padding:5px 6px;cursor:pointer;position:relative;background:var(--paper);
  width:100%;height:100%;text-align:left;font:inherit;color:inherit;border-radius:0;
  appearance:none;-webkit-appearance:none;display:block;min-width:0;
}
.cal-day:hover{background:var(--newsprint);}
.cal-day.other{background:var(--newsprint-2);opacity:.55;}
.cal-day.asof{box-shadow:inset 0 0 0 2px var(--ink);}
.cal-day.selected{background:var(--newsprint);}
.cal-date{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;}
.cal-total{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;}
.cal-entry{
  font-size:10.5px;line-height:1.3;margin-top:3px;padding-left:8px;position:relative;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.cal-entry::before{
  content:"";position:absolute;left:0;top:5px;width:4px;height:4px;background:var(--ink);
  box-sizing:border-box;
}
.cal-entry.paid{font-style:normal;color:var(--ink);}
.cal-entry.scheduled{font-style:italic;color:var(--muted);}
.cal-entry.scheduled::before{
  background:transparent;border:1px solid var(--ink);
}
.cal-more{font-size:9.5px;color:var(--faint);margin-top:2px;}
tr.charge-scheduled td[data-label="Subscriber"]{font-style:italic;}
tr.charge-paid td[data-label="Subscriber"]{font-style:normal;}
.cal-modal{
  position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;
  padding:18px;width:100%;max-width:100%;overflow:hidden;box-sizing:border-box;
}
.cal-modal[hidden]{display:none !important;}
.cal-modal-scrim{
  position:absolute;inset:0;background:rgba(17,17,17,.46);border:0;padding:0;margin:0;cursor:pointer;
}
.cal-modal-paper{
  position:relative;z-index:1;width:min(560px,100%);max-width:100%;min-width:0;
  max-height:min(92dvh,92vh,780px);
  overflow:hidden;background:var(--paper);border:1px solid var(--ink);
  padding:0 0 12px;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;box-sizing:border-box;
}
.cal-modal-rule{height:1px;background:var(--ink);}
.cal-modal-rule.thick{height:4px;background:var(--ink);}
.cal-modal-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding:14px 16px 10px;
}
.cal-modal-head h2{
  font-family:var(--serif);font-size:22px;font-weight:700;margin:4px 0 0;line-height:1.15;
  letter-spacing:-.01em;
}
.cal-modal-paper .figures{margin:0 16px 12px;flex-shrink:0;}
.cal-modal-paper .table-wrap{margin:0 16px;overflow:auto;flex:1 1 auto;min-height:0;}
.cal-modal-paper .muted{margin:0 16px 10px;}
.cal-modal-paper table.data th:nth-child(3),
.cal-modal-paper table.data td:nth-child(3){white-space:nowrap;}
.cal-modal-head{flex-shrink:0;background:var(--paper);}
.scrim{display:none;}
.tabbar{display:none;}
.noscript{max-width:420px;margin:40px auto;padding:24px;background:var(--paper);border:1px solid var(--rule);}
@media (max-width:780px){
  body{font-size:15px;}
  .sidebar{
    transform:translateX(-100%);transition:transform .22s ease;width:270px;
  }
  .sidebar.open{transform:translateX(0);}
  .sidebar.open ~ .scrim{
    display:block;position:fixed;inset:0;z-index:38;
    background:rgba(17,17,17,.42);border:0;padding:0;margin:0;
  }
  .main{margin-left:0;padding-bottom:var(--tabbar-h);}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:30;background:var(--paper);
    border-bottom:3px solid var(--ink);
    padding-top:env(safe-area-inset-top);
    padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);
  }
  .topbar-title{font-family:var(--serif);font-size:17px;font-weight:700;flex:1;text-align:center;}
  .view{padding:14px max(14px, env(safe-area-inset-right)) 28px max(14px, env(safe-area-inset-left));width:100%;max-width:100%;overflow-x:hidden;}
  .colophon{padding:14px 14px 16px;}
  .page-head h1{font-size:23px;}
  input.search{min-width:0;width:100%;flex:1 1 100%;}
  .filters{max-width:100%;}
  .chip{max-width:100%;}
  .figure{flex-basis:calc(50% - 1px);max-width:100%;}
  .figure.lead{flex-basis:100%;}
  .figure .value{font-size:24px;}
  .figure.lead .value{font-size:31px;}
  .month-rev-readout{font-size:16px;padding:9px 11px;}
  table.data.stack thead{display:none;}
  table.data.stack tr{display:block;border-bottom:1px solid var(--rule);padding:11px 12px;}
  table.data.stack tr:hover{background:var(--paper);}
  table.data.stack td{
    display:flex;justify-content:space-between;gap:12px;padding:2px 0;border:0;text-align:right;
  }
  table.data.stack td::before{
    content:attr(data-label);font-size:10px;font-weight:700;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);text-align:left;flex-shrink:0;
  }
  table.data.stack td.headline{display:block;text-align:left;font-weight:700;font-size:14.5px;margin-bottom:5px;}
  table.data.stack td.headline::before{display:none;}
  table.data.stack tr.total td{background:none;}
  .cal-day{min-height:78px;padding:3px 3px 4px;}
  .cal-entry{
    display:block;font-size:9px;line-height:1.25;margin-top:2px;padding-left:7px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .cal-entry::before{top:3px;width:3px;height:3px;}
  .cal-total{font-size:9.5px;font-weight:700;color:var(--ink);}
  .cal-more{font-size:9px;}
  .cal-modal{padding:10px;align-items:flex-end;max-width:100%;}
  .cal-modal-paper{max-height:min(92dvh,92vh,740px);width:100%;max-width:100%;}
  .cal-modal-head h2{font-size:20px;}
  .tabbar{
    display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
    position:fixed;bottom:0;left:0;right:0;z-index:50;
    width:100%;max-width:100%;overflow:hidden;
    background:var(--paper);border-top:3px solid var(--ink);
    padding-bottom:env(safe-area-inset-bottom);
    padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);
  }
  .tab{
    background:none;border:0;padding:8px 2px 7px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
    min-width:0;max-width:100%;overflow:hidden;
  }
  .tab .tab-mark{font-family:var(--serif);font-size:15px;line-height:1;}
  .tab.active{color:var(--ink);font-weight:700;}
  .tab.active .tab-mark{text-decoration:underline;text-underline-offset:3px;}
}
@media (max-width:330px){.figure{flex-basis:100%;}}
@media print{
  .sidebar,.tabbar,.topbar,.page-actions,.colophon,.scrim,.cal-modal{display:none !important;}
  .main{margin-left:0;padding:0;}
  body{background:#fff;}
  .view{padding:0;max-width:100%;}
}
</style>
</head>

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, function(c){
    return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c];
  });
}
function usd(n){
  if (n === null || n === undefined || n === "") return "\u2014";
  return Number(n).toLocaleString("en-US", {style:"currency", currency:"USD"});
}
function usdOrUnknown(n){
  if (n === null || n === undefined || n === "") return "Unknown";
  return usd(n);
}
function shopifyFee(amount){
  if (amount === null || amount === undefined || amount === "") return null;
  const rate = (DATA && DATA.subscribers && DATA.subscribers.feeRate) || {percent:0.029, fixed:0.30};
  return Math.round((Number(amount) * rate.percent + rate.fixed) * 100) / 100;
}
function netAfterFee(amount){
  const fee = shopifyFee(amount);
  if (fee === null) return null;
  return Math.round((Number(amount) - fee) * 100) / 100;
}
function chargeTotal(e){
  if (e.total !== null && e.total !== undefined) return e.total;
  if (e.shippingKnown === false || e.shipping === null || e.shipping === undefined) return null;
  return Math.round((Number(e.price) + Number(e.shipping)) * 100) / 100;
}
function shortName(name){
  const parts = String(name || "").split(" ").filter(Boolean);
  if (parts.length < 2) return parts[0] || "";
  return parts[0] + " " + parts[parts.length - 1][0] + ".";
}
function addInterval(iso, unit, count){
  const p = iso.split("-").map(Number);
  const y = p[0], m = p[1], d = p[2];
  const n = count || 1;
  if ((unit || "month").toLowerCase().indexOf("week") === 0){
    const dt = new Date(Date.UTC(y, m - 1, d + 7 * n));
    return dt.toISOString().slice(0, 10);
  }
  const dim = new Date(Date.UTC(y, m - 1 + n + 1, 0)).getUTCDate();
  const day = Math.min(d, dim);
  const dt = new Date(Date.UTC(y, m - 1 + n, day));
  return dt.toISOString().slice(0, 10);
}
function fmtDate(iso){
  if (!iso) return "\u2014";
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const p = iso.split("-");
  return months[Number(p[1]) - 1] + " " + Number(p[2]) + ", " + p[0];
}
function fmtDateLong(iso){
  if (!iso) return "\u2014";
  const p = iso.split("-").map(Number);
  const dt = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
  return dt.toLocaleDateString("en-US", {weekday:"long", month:"long", day:"numeric", year:"numeric", timeZone:"UTC"});
}
function chargeTime(e){
  return (e && (e.chargeTime || e.time)) || "";
}
function chargeTimeMinutes(e){
  const t = chargeTime(e);
  const m = String(t).match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
  if (!m) return 24 * 60 + 1;
  let h = parseInt(m[1], 10);
  const min = parseInt(m[2], 10);
  const ap = m[3].toUpperCase();
  if (ap === "AM"){
    if (h === 12) h = 0;
  } else if (h !== 12){
    h += 12;
  }
  return h * 60 + min;
}
function compareCharges(a, b){
  return String(a.date || "").localeCompare(String(b.date || "")) ||
    (chargeTimeMinutes(a) - chargeTimeMinutes(b)) ||
    String(a.name || "").localeCompare(String(b.name || ""));
}
function monthName(m){
  return ["January","February","March","April","May","June","July","August","September","October","November","December"][m];
}
function b64ToBytes(b64){
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function deriveAesKey(password){
  const enc = new TextEncoder();
  const salt = b64ToBytes(PAYLOAD.salt);
  const material = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:salt, iterations:PAYLOAD.iterations, hash:"SHA-256"},
    material,
    {name:"AES-GCM", length:256},
    false,
    ["decrypt"]
  );
}
async function decryptWithKey(key){
  const iv = b64ToBytes(PAYLOAD.iv);
  const ciphertext = b64ToBytes(PAYLOAD.ciphertext);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:iv}, key, ciphertext);
  return JSON.parse(new TextDecoder().decode(plain));
}
async function decryptWithPassword(password){
  const key = await deriveAesKey(password);
  const data = await decryptWithKey(key);
  return {data:data, key:key};
}

const REMEMBER_DB = "tww-desk";
const REMEMBER_STORE = "keys";
const REMEMBER_ID = "phone";

function openRememberDb(){
  return new Promise(function(resolve, reject){
    if (!window.indexedDB){
      reject(new Error("no-idb"));
      return;
    }
    const req = indexedDB.open(REMEMBER_DB, 1);
    req.onupgradeneeded = function(){
      const db = req.result;
      if (!db.objectStoreNames.contains(REMEMBER_STORE)){
        db.createObjectStore(REMEMBER_STORE, {keyPath:"id"});
      }
    };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error || new Error("idb-open")); };
  });
}
async function saveRememberedKey(key){
  try {
    const db = await openRememberDb();
    await new Promise(function(resolve, reject){
      const tx = db.transaction(REMEMBER_STORE, "readwrite");
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ reject(tx.error); };
      tx.objectStore(REMEMBER_STORE).put({
        id: REMEMBER_ID,
        key: key,
        salt: PAYLOAD.salt,
        iterations: PAYLOAD.iterations
      });
    });
    db.close();
  } catch (e) {}
}
async function loadRememberedKey(){
  try {
    const db = await openRememberDb();
    const rec = await new Promise(function(resolve, reject){
      const tx = db.transaction(REMEMBER_STORE, "readonly");
      const req = tx.objectStore(REMEMBER_STORE).get(REMEMBER_ID);
      req.onsuccess = function(){ resolve(req.result || null); };
      req.onerror = function(){ reject(req.error); };
    });
    db.close();
    if (!rec || !rec.key) return null;
    if (rec.salt !== PAYLOAD.salt || rec.iterations !== PAYLOAD.iterations){
      await clearRememberedKey();
      return null;
    }
    return rec.key;
  } catch (e) {
    return null;
  }
}
async function clearRememberedKey(){
  try {
    const db = await openRememberDb();
    await new Promise(function(resolve, reject){
      const tx = db.transaction(REMEMBER_STORE, "readwrite");
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ reject(tx.error); };
      tx.objectStore(REMEMBER_STORE).delete(REMEMBER_ID);
    });
    db.close();
  } catch (e) {}
}

function niceMax(max){
  if (max <= 0) return 1;
  const exp = Math.pow(10, Math.floor(Math.log10(max)));
  const n = max / exp;
  const nice = n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10;
  return nice * exp;
}
function groupedBars(months){
  const w = 760, h = 250;
  const pad = {t:18, r:12, b:36, l:50};
  const innerW = w - pad.l - pad.r;
  const innerH = h - pad.t - pad.b;
  const max = niceMax(Math.max.apply(null, months.map(function(m){ return Math.max(m.revenue, m.expenses); })) || 1);
  const gap = innerW / months.length;
  const bw = Math.max(5, gap * 0.30);
  let svg = '<svg class="chart" viewBox="0 0 ' + w + " " + h + '" role="img" aria-label="Monthly revenue versus expenses">';
  svg += '<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#111111" stroke-width="3"/></pattern></defs>';
  for (let i = 0; i <= 4; i++){
    const val = max * i / 4;
    const y = pad.t + innerH * (1 - i / 4);
    svg += '<line x1="' + pad.l + '" x2="' + (w - pad.r) + '" y1="' + y + '" y2="' + y + '" stroke="#d6d3cc" stroke-width="1"/>';
    svg += '<text x="' + (pad.l - 6) + '" y="' + (y + 3) + '" text-anchor="end" class="chart-tick">$' + Math.round(val).toLocaleString("en-US") + "</text>";
  }
  months.forEach(function(m, i){
    const mid = pad.l + i * gap + gap / 2;
    const hR = innerH * (m.revenue / max);
    const hE = innerH * (m.expenses / max);
    const yR = pad.t + innerH - hR;
    const yE = pad.t + innerH - hE;
    svg += '<rect x="' + (mid - bw - 2) + '" y="' + yR + '" width="' + bw + '" height="' + Math.max(hR, 0) + '" fill="#111111"><title>' + esc(m.label) + " revenue " + usd(m.revenue) + "</title></rect>";
    svg += '<rect x="' + (mid + 2) + '" y="' + yE + '" width="' + bw + '" height="' + Math.max(hE, 0) + '" fill="url(#hatch)" stroke="#111111" stroke-width="0.6"><title>' + esc(m.label) + " expenses " + usd(m.expenses) + "</title></rect>";
    svg += '<text x="' + mid + '" y="' + (h - 12) + '" text-anchor="middle" class="chart-axis">' + esc(m.label) + "</text>";
  });
  svg += "</svg>";
  return svg;
}
function hbars(items, aria){
  const w = 760;
  const rowH = 38;
  const padL = 210, padR = 96, padT = 10;
  const max = Math.max.apply(null, items.map(function(it){ return Math.max(it.value || 0, it.target || 0); }).concat([1]));
  const barW = w - padL - padR;
  const h = padT + items.length * rowH + 8;
  let svg = '<svg class="chart" viewBox="0 0 ' + w + " " + h + '" role="img" aria-label="' + esc(aria || "Bar chart") + '">';
  items.forEach(function(it, i){
    const y = padT + i * rowH;
    const bw = barW * ((it.value || 0) / max);

function revenueMax(max){

function revenueBars(months){
  const w = 420, h = 252;

  const innerW = w - pad.l - pad.r;
  const innerH = h - pad.t - pad.b;
  const rawMax = Math.max.apply(null, months.map(function(m){ return Number(m.revenue) || 0; })) || 1;
  const max = revenueMax(rawMax);
  const step = max <= 200 ? 50 : max <= 1000 ? 100 : 500;
  const gap = innerW / months.length;
  const bw = Math.max(7, gap * 0.5);
  let svg = '<svg class="chart month-rev-chart" viewBox="0 0 ' + w + " " + h + '" role="img" aria-label="Monthly cash-basis revenue">';
  for (let val = 0; val <= max + 0.001; val += step){
    const y = pad.t + innerH * (1 - val / max);
    svg += '<line x1="' + pad.l + '" x2="' + (w - pad.r) + '" y1="' + y + '" y2="' + y + '" stroke="#d6d3cc" stroke-width="1"/>';
    svg += '<text x="' + (pad.l - 5) + '" y="' + (y + 3) + '" text-anchor="end" class="chart-tick">$' + Math.round(val).toLocaleString("en-US") + "</text>";
  }
  svg += '<line x1="' + pad.l + '" x2="' + (w - pad.r) + '" y1="' + (pad.t + innerH) + '" y2="' + (pad.t + innerH) + '" stroke="#111111" stroke-width="1"/>';
  months.forEach(function(m, i){
    const mid = pad.l + i * gap + gap / 2;
    const value = Number(m.revenue) || 0;
    const hR = innerH * (value / max);
    const yR = pad.t + innerH - hR;
    const axis = (m.label || "") + (m.partial ? "*" : "");
    const valLabel = value === 0 ? "$0" : usd(value);
    const labelY = (hR < 14) ? (pad.t + innerH - 8) : (yR - 7);
    svg += '<g class="rev-col' + (i === months.length - 1 ? " selected" : "") + '" data-i="' + i +
      '" role="button" tabindex="0" aria-label="' + esc(monthReadout(m)) + '">';
    svg += '<rect class="rev-hit" x="' + (mid - gap / 2) + '" y="' + (pad.t - 8) + '" width="' + gap + '" height="' + (innerH + 32) + '" fill="transparent"/>';
    svg += '<rect class="rev-bar" x="' + (mid - bw / 2) + '" y="' + yR + '" width="' + bw + '" height="' + Math.max(hR, value ? 1.5 : 0) + '"/>';
    svg += '<text class="chart-bar-val" text-anchor="start" dominant-baseline="middle" transform="rotate(-90 ' +
      mid.toFixed(2) + " " + labelY.toFixed(2) + ')" x="' + mid.toFixed(2) + '" y="' + labelY.toFixed(2) + '">' +
      esc(valLabel) + "</text>";
    svg += '<text class="chart-axis rev-month" text-anchor="middle" x="' + mid.toFixed(2) + '" y="' + (h - 12) + '">' + esc(axis) + "</text>";
    svg += '<line class="rev-underline" x1="' + (mid - 9) + '" x2="' + (mid + 9) + '" y1="' + (h - 6) + '" y2="' + (h - 6) + '"/>';
    svg += "</g>";
  });
  svg += "</svg>";
  return svg;
}

function filteredSubs(){
  const q = subState.q.trim().toLowerCase();
  let rows = DATA.subscribers.list.filter(function(s){
    if (subState.status !== "all" && s.status !== subState.status) return false;
    if (subState.group !== "all" && s.group !== subState.group) return false;
    if (!q) return true;
    return s.name.toLowerCase().includes(q) || s.product.toLowerCase().includes(q) || (s.town || "").toLowerCase().includes(q);
  }).slice();
  const key = subState.sort, dir = subState.dir;
  rows.sort(function(a, b){
    let av, bv;
    if (key === "name") return dir * a.name.localeCompare(b.name);
    if (key === "product") return dir * a.product.localeCompare(b.product);
    if (key === "status") return dir * a.status.localeCompare(b.status) || a.name.localeCompare(b.name);
    if (key === "price") return dir * ((a.price ?? -1) - (b.price ?? -1));
    if (key === "shipping"){
      const av = a.shippingKnown ? a.shipping : -1;
      const bv = b.shippingKnown ? b.shipping : -1;
      return dir * (av - bv);
    }
    if (key === "total"){
      const av = a.totalEach ?? -1;
      const bv = b.totalEach ?? -1;
      return dir * (av - bv);
    }
    if (key === "spent") return dir * (a.spent - b.spent);
    if (key === "next"){
      if (!a.nextBilling && !b.nextBilling) return a.name.localeCompare(b.name);
      if (!a.nextBilling) return 1;
      if (!b.nextBilling) return -1;
      return dir * a.nextBilling.localeCompare(b.nextBilling) || a.name.localeCompare(b.name);
    }
    if (key === "start"){
      if (!a.startDate && !b.startDate) return a.name.localeCompare(b.name);
      if (!a.startDate) return 1;
      if (!b.startDate) return -1;
      return dir * a.startDate.localeCompare(b.startDate);
    }
    if (key === "town") return dir * (a.town || "").localeCompare(b.town || "");
    return 0;
  });
  return rows;
}

function addDaysIso(iso, days){
  const p = String(iso || "").split("-").map(Number);
  if (p.length < 3 || !p[0]) return "";

  return dt.toISOString().slice(0, 10);
}

}

    if (!a.date) return 1;
    if (!b.date) return -1;
    return b.date.localeCompare(a.date) || a.name.localeCompare(b.name) || String(a.product||"").localeCompare(String(b.product||""));

function cancellationCounts(list){
  const today = todayCT();
  const monthPrefix = today.slice(0, 7);
  const cutoff = addDaysIso(today, -30);
  let thisMonth = 0, last30 = 0;
  const names = {};
  list.forEach(function(row){
    names[row.name] = true;

    if (cutoff && row.date >= cutoff && row.date <= today) last30 += 1;
  });
  const monthlyLost = list.reduce(function(sum, row){ return sum + Number(row.monthly || 0); }, 0);
  return {
    thisMonth: thisMonth,
    last30Days: last30,
    allTime: list.length,
    people: Object.keys(names).length,
    monthlyRevenueLost: Math.round(monthlyLost * 100) / 100
  };

function scheduleDatesFor(s, startIso, endIso, walkBack){
  // Every date in [startIso, endIso] on this contract's schedule. Walks
  // backwards from nextBilling as well as forwards, so a renewal that moves
  // nextBilling ahead never erases the date it just billed.
  const out = [], seen = {};
  if (!s.nextBilling) return out;
  const unit = s.intervalUnit, n = s.intervalCount || 1;
  const back = [];
  for (let k = 1; walkBack && k <= 120; k++){
    const x = addInterval(s.nextBilling, unit, -n * k);
    if (x < startIso) break;
    if (x <= endIso) back.push(x);
  }
  back.reverse().forEach(function(x){ if (!seen[x]){ seen[x] = true; out.push(x); } });
  let d = s.nextBilling, guard = 0;
  while (d < startIso && guard < 120){ d = addInterval(d, unit, n); guard++; }
  guard = 0;
  while (d <= endIso && guard < 120){
    if (d >= startIso && !seen[d]){ seen[d] = true; out.push(d); }
    d = addInterval(d, unit, n);
    guard++;
  }
  return out;
}

      const total = s.shippingKnown ? s.totalEach : null;
      const fee = total === null ? null : shopifyFee(total);

function calendarEvents(startIso, endIso){

    if (!o || !o.date) return;
    if (o.date > today) return;
    const key = o.orderName ? ("#" + o.orderName) : null;
    if (key && seenOrders[key]) return;
    if (key) seenOrders[key] = true;
    const total = o.total != null ? o.total : o.gross;
    const e = {
      date: o.date,

      product: o.product,
      intervalLabel: o.intervalLabel || (o.kind === "one-time" ? "One-time" : ""),
      town: o.town || "",

      shipping: o.shipping,
      shippingKnown: o.shippingKnown !== false,
      total: total,
      fee: o.fee != null ? o.fee : shopifyFee(total),
      net: o.net != null ? o.net : netAfterFee(total),
      chargeTime: o.chargeTime || o.time || "",
      source: "actual",
      kind: o.kind || "one-time",
      orderName: o.orderName || "",
      financialStatus: o.financialStatus || "",
      partialRefund: !!o.partialRefund,

  h += section("Things to keep in mind", "", "<ul class=\"list\">" + n.caveats.map(function(b){
    return "<li>" + esc(b) + "</li>";
  }).join("") + "</ul>");
  h += section("Why the old dashboard was off", "", "<ul class=\"list\">" + n.oldDashboard.map(function(b){
    return "<li>" + esc(b) + "</li>";
  }).join("") + "</ul><p class=\"prose\">" + esc(n.oldDashboardClose) + "</p>");
  h += section("Open questions", "From the Needs review tab, as of " + DATA.meta.asOfDisplay,
    '<div class="table-wrap"><table class="data stack"><thead><tr><th>Date</th><th>Item</th><th class="num">Amount</th><th>What to confirm</th></tr></thead><tbody>' +
    n.openQuestions.map(function(q){
      return "<tr>" + td("Date", esc(q.dateDisplay), "headline") + td("Item", esc(q.item)) +
        td("Amount", usd(q.amount), "num") + td("What to confirm", esc(q.confirm)) + "</tr>";
    }).join("") + "</tbody></table></div>");
  h += '<p class="prose" style="margin-top:16px">' + esc(DATA.meta.sheetNote) + "</p>";
  return h;
}

const VIEWS = {
  front: renderFront,
  accounts: renderAccounts,
  pnl: renderPnl,
  subscribers: renderSubscribers,
  calendar: renderCalendar,
  expenses: renderExpenses,
  tax: renderTax,
  notes: renderNotes
};

function navigate(id, push){
  if (!VIEWS[id]) id = "front";
  if (id !== "calendar") closeCalModal();
  currentView = id;
  if (push !== false){
    const hash = "#" + id;
    if (location.hash !== hash) history.replaceState(null, "", hash);
  }
  document.querySelectorAll(".nav-item").forEach(function(el){
    el.classList.toggle("active", el.getAttribute("data-go") === id);
  });
  document.querySelectorAll(".tab").forEach(function(el){
    el.classList.toggle("active", el.getAttribute("data-go") === id);
  });
  const item = NAV.find(function(n){ return n.id === id; });
  document.getElementById("topbar-title").textContent = item ? item.title : "Front page";
  document.getElementById("view").innerHTML = VIEWS[id]();
  bindView();
  closeMenu();
  window.scrollTo(0, 0);
}

function bindMonthlyChart(){
  const root = document.getElementById("month-rev");
  if (!root) return;
  const months = chartMonths();
  const readout = document.getElementById("month-rev-readout");
  const select = function(i){
    root.querySelectorAll(".rev-col").forEach(function(el){
      el.classList.toggle("selected", el.getAttribute("data-i") === String(i));
    });
    if (readout && months[i]) readout.textContent = monthReadout(months[i]);
  };
  root.querySelectorAll(".rev-col").forEach(function(el){
    const i = Number(el.getAttribute("data-i"));
    const activate = function(ev){ ev.preventDefault(); select(i); };
    el.addEventListener("click", activate);
    el.addEventListener("keydown", function(ev){
      if (ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); select(i); }
    });
  });
}
function bindView(){
  document.getElementById("view").querySelectorAll("[data-go]").forEach(function(el){
    el.addEventListener("click", function(){ navigate(el.getAttribute("data-go")); });
  });
  if (currentView === "subscribers") bindSubscribers();
  if (currentView === "calendar") bindCalendar();
  if (currentView === "front") bindMonthlyChart();
}
function bindSubscribers(){
  const root = document.getElementById("view");
  root.querySelectorAll("[data-filter]").forEach(function(btn){
    btn.addEventListener("click", function(){
      const group = btn.getAttribute("data-filter");
      const value = btn.getAttribute("data-value");
      if (group === "status") subState.status = value;
      if (group === "group") subState.group = value;
      if (group === "cols") subState.cols = value;
      navigate("subscribers", false);
      const q = document.getElementById("sub-q");
      if (q) q.focus();
    });
  });
  const q = document.getElementById("sub-q");
  if (q){
    q.addEventListener("input", function(){
      subState.q = q.value;
      document.getElementById("sub-table-wrap").innerHTML = renderSubTable();
      bindSubSort();
    });
  }
  bindSubSort();
  bindCancellations();
}
function bindCancellations(){
  const btn = document.getElementById("cancel-show-all");
  if (!btn) return;
  btn.addEventListener("click", function(){
    cancelShowAll = !cancelShowAll;
    const box = document.getElementById("cancel-box");
    const wrap = document.createElement("div");
    wrap.innerHTML = renderCancellations();
    const next = wrap.firstElementChild;
    if (box && next && box.parentNode){
      box.parentNode.replaceChild(next, box);
      bindCancellations();
    }
  });
}
function bindSubSort(){
  document.querySelectorAll("th.sort").forEach(function(thEl){
    thEl.addEventListener("click", function(){
      const key = thEl.getAttribute("data-sort");
      if (subState.sort === key) subState.dir *= -1;
      else { subState.sort = key; subState.dir = key === "name" || key === "town" || key === "product" || key === "next" ? 1 : -1; }
      document.getElementById("sub-table-wrap").innerHTML = renderSubTable();
      bindSubSort();
    });
  });
}
function monthEventsNow(){
  const bounds = monthBounds(calYear, calMonth);
  return calendarEvents(bounds.start, bounds.end);
}
let scrollLockY = 0;
function lockPageScroll(){
  scrollLockY = window.scrollY || document.documentElement.scrollTop || 0;
  document.documentElement.classList.add("scroll-locked");
  document.body.classList.add("scroll-locked");
  document.body.style.top = "-" + scrollLockY + "px";
}
function unlockPageScroll(){
  document.documentElement.classList.remove("scroll-locked");
  document.body.classList.remove("scroll-locked");
  document.body.style.top = "";
  window.scrollTo(0, scrollLockY);
}
function closeCalModal(){
  const modal = document.getElementById("cal-modal");
  if (modal){
    modal.hidden = true;
    modal.innerHTML = "";
  }
  selectedDay = null;
  document.querySelectorAll(".cal-day.selected").forEach(function(el){ el.classList.remove("selected"); });
  unlockPageScroll();
  if (window._calEsc){
    document.removeEventListener("keydown", window._calEsc);
    window._calEsc = null;
  }
}
function openCalModal(iso){
  const modal = document.getElementById("cal-modal");
  if (!modal) return;
  const byDate = eventsByDate(monthEventsNow());
  const dayEvents = (byDate[iso] || []).slice().sort(compareCharges);
  if (!dayEvents.length) return;
  selectedDay = iso;
  document.querySelectorAll("[data-day]").forEach(function(el){
    el.classList.toggle("selected", el.getAttribute("data-day") === iso);
  });
  const split = splitBySource(dayEvents);
  const chargedGross = sumCharges(split.charged, "total");
  const scheduledGross = sumCharges(split.scheduled, "total");
  const dayTotal = sumCharges(dayEvents, "total");
  const dayNet = sumCharges(dayEvents, "net");
  let rows = dayEvents.map(function(e){
    const total = chargeTotal(e);
    const fee = e.fee != null ? e.fee : shopifyFee(total);
    const net = e.net != null ? e.net : netAfterFee(total);
    const shipLine = e.shippingKnown
      ? '<div class="secondary">' + usd(e.price) + " + " + usd(e.shipping) + " shipping</div>"
      : '<div class="secondary">' + usd(e.price) + " + shipping unknown</div>";
    const keep = net == null
      ? "Unknown"
      : usd(net) + '<div class="secondary">less ' + usd(fee) + "</div>";
    return '<tr class="' + (isPaidEvent(e) ? "charge-paid" : "charge-scheduled") + '">' +
      td("Subscriber", esc(e.name) + chargeMeta(e), "headline") +
      td("Plan", esc(e.product) + '<div class="secondary">' + esc(e.intervalLabel || "") + "</div>") +
      td("Time", chargeTime(e) ? esc(chargeTime(e)) : "\u2014") +
      td("Charge", (total == null ? "Unknown" : usd(total)) + shipLine, "num") +
      td("You keep", keep, "num") +
      "</tr>";
  }).join("");
  modal.innerHTML =
    '<button type="button" class="cal-modal-scrim" id="cal-modal-scrim" aria-label="Close"></button>' +
    '<div class="cal-modal-paper" role="dialog" aria-modal="true" aria-labelledby="cal-modal-title">' +
      '<div class="cal-modal-rule"></div>' +
      '<div class="cal-modal-head">' +
        '<div><div class="kicker">Charges that day</div>' +
        '<h2 id="cal-modal-title">' + esc(fmtDateLong(iso)) + "</h2></div>" +
        '<button type="button" class="icon-btn" id="cal-modal-close" aria-label="Close">\u00d7</button>' +
      "</div>" +
      '<div class="cal-modal-rule thick"></div>' +
      '<div class="figures">' +
        figure("Charged so far", usd(chargedGross.sum), sourceCaption(split.charged, "order", "orders"), "lead") +
        figure("Still scheduled", usd(scheduledGross.sum), sourceCaption(split.scheduled, "charge", "charges")) +
        figure("That day", usd(dayTotal.sum), usd(dayNet.sum) + " after fees  \u00b7  charged + scheduled") +
      "</div>" +
      '<div class="table-wrap"><table class="data stack"><thead><tr>' +
        "<th>Subscriber</th><th>Plan</th><th>Time</th>" +
        '<th class="num">Charge</th><th class="num">You keep</th>' +
      "</tr></thead><tbody>" + rows + "</tbody></table></div>" +
    "</div>";
  modal.hidden = false;
  lockPageScroll();
  const closer = function(){ closeCalModal(); };
  document.getElementById("cal-modal-close").addEventListener("click", closer);
  document.getElementById("cal-modal-scrim").addEventListener("click", closer);
  if (window._calEsc) document.removeEventListener("keydown", window._calEsc);
  window._calEsc = function(ev){
    if (ev.key === "Escape"){ ev.preventDefault(); closeCalModal(); }
  };
  document.addEventListener("keydown", window._calEsc);
  document.getElementById("cal-modal-close").focus();
}
function bindCalendar(){
  const asOf = DATA.meta.asOf.split("-").map(Number);
  document.getElementById("cal-prev").addEventListener("click", function(){
    if (calMonth === 0){ calYear -= 1; calMonth = 11; }
    else calMonth -= 1;
    closeCalModal();
    navigate("calendar", false);
  });
  document.getElementById("cal-next").addEventListener("click", function(){
    if (calMonth === 11){ calYear += 1; calMonth = 0; }
    else calMonth += 1;
    closeCalModal();
    navigate("calendar", false);
  });
  document.getElementById("cal-asof").addEventListener("click", function(){
    calYear = asOf[0];
    calMonth = asOf[1] - 1;
    closeCalModal();
    navigate("calendar", false);
  });
  document.querySelectorAll("[data-day]").forEach(function(el){
    const open = function(){
      const iso = el.getAttribute("data-day");
      const byDate = eventsByDate(monthEventsNow());
      if (!(byDate[iso] || []).length) return;
      if (selectedDay === iso && document.getElementById("cal-modal") && !document.getElementById("cal-modal").hidden){
        closeCalModal();
        return;
      }
      openCalModal(iso);
    };
    el.addEventListener("click", open);
    el.addEventListener("keydown", function(ev){
      if (ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); open(); }
    });
  });
}
function showApp(data){
  DATA = data;
  const asOf = data.meta.asOf.split("-").map(Number);
  calYear = asOf[0];
  calMonth = asOf[1] - 1;
  document.getElementById("gate").hidden = true;
  document.getElementById("app").hidden = false;
  document.getElementById("side-dateline").textContent = data.meta.asOfDisplay;
  document.getElementById("colophon").textContent = "As of " + data.meta.asOfDisplay + ", " + data.meta.timezoneLabel + ".";
  const desk = NAV.map(function(n){
    return '<button class="nav-item" data-go="' + n.id + '"><span class="nav-num">' + n.mark + "</span>" + esc(n.title) + "</button>";
  }).join("");
  document.getElementById("nav-desktop").innerHTML = '<div class="nav-group">The Desk</div>' + desk;
  document.getElementById("nav-mobile").innerHTML = NAV.filter(function(n){ return n.tabbar; }).map(function(n){
    return '<button class="tab" data-go="' + n.id + '"><span class="tab-mark">' + n.mark + "</span>" + esc(n.tab) + "</button>";
  }).join("");
  document.getElementById("nav-desktop").onclick = function(e){
    const btn = e.target.closest("[data-go]");
    if (btn) navigate(btn.getAttribute("data-go"));
  };
  document.getElementById("nav-mobile").onclick = function(e){
    const btn = e.target.closest("[data-go]");
    if (btn) navigate(btn.getAttribute("data-go"));
  };
  const fromHash = (location.hash || "").replace(/^#\/?/, "");
  navigate(VIEWS[fromHash] ? fromHash : "front", false);
}
function showLockScreen(){
  DATA = null;
  document.getElementById("view").innerHTML = "";
  document.getElementById("app").hidden = true;
  document.getElementById("gate").hidden = false;
  document.getElementById("gate-password").value = "";
  document.getElementById("gate-error").hidden = true;
  closeMenu();
  const pw = document.getElementById("gate-password");
  if (pw) pw.focus();
}
function lockDesk(){
  try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
  clearRememberedKey().then(showLockScreen, showLockScreen);
}
function closeMenu(){
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("scrim").hidden = true;
}
function openMenu(){
  document.getElementById("sidebar").classList.add("open");
  document.getElementById("scrim").hidden = false;
}

document.getElementById("gate-form").addEventListener("submit", function(ev){
  ev.preventDefault();
  const input = document.getElementById("gate-password");
  const btn = document.getElementById("gate-submit");
  const err = document.getElementById("gate-error");
  const password = input.value;
  err.hidden = true;
  if (!password){
    err.textContent = "Please enter the desk password.";
    err.hidden = false;
    return;
  }
  btn.disabled = true;
  btn.textContent = "Unlocking\u2026";
  decryptWithPassword(password).then(function(result){
    const data = result.data;
    const remember = document.getElementById("gate-remember") && document.getElementById("gate-remember").checked;
    const after = remember ? saveRememberedKey(result.key) : clearRememberedKey();
    return Promise.resolve(after).then(function(){ return data; });
  }).then(function(data){
    try { sessionStorage.setItem(SESSION_KEY, JSON.stringify(data)); } catch (e) {}
    input.value = "";
    btn.disabled = false;
    btn.textContent = "Open the desk";
    showApp(data);
  }).catch(function(){
    btn.disabled = false;
    btn.textContent = "Open the desk";
    err.textContent = "That password did not unlock the desk. Please try again.";
    err.hidden = false;
    input.select();
  });
});
document.getElementById("btn-lock").addEventListener("click", lockDesk);
document.getElementById("btn-lock-top").addEventListener("click", lockDesk);
document.getElementById("btn-menu").addEventListener("click", function(){
  if (document.getElementById("sidebar").classList.contains("open")) closeMenu();
  else openMenu();
});
document.getElementById("scrim").addEventListener("click", closeMenu);
window.addEventListener("hashchange", function(){
  if (!DATA) return;
  const id = (location.hash || "").replace(/^#\/?/, "");
  if (VIEWS[id] && id !== currentView) navigate(id, false);
});

(function preventMobileZoom(){
  const stop = function(e){ e.preventDefault(); };
  document.addEventListener("gesturestart", stop, {passive:false});
  document.addEventListener("gesturechange", stop, {passive:false});
  document.addEventListener("gestureend", stop, {passive:false});
  document.addEventListener("dblclick", stop, {passive:false});
  document.addEventListener("touchmove", function(e){
    if (e.touches && e.touches.length > 1) e.preventDefault();
  }, {passive:false});
})();

(function boot(){
  try {
    const cached = sessionStorage.getItem(SESSION_KEY);
    if (cached){
      showApp(JSON.parse(cached));
      return;
    }
  } catch (e) {}
  loadRememberedKey().then(function(key){
    if (!key) return;
    return decryptWithKey(key).then(function(data){
      try { sessionStorage.setItem(SESSION_KEY, JSON.stringify(data)); } catch (e) {}
      showApp(data);
    }).catch(function(){
      return clearRememberedKey();
    });
  }).catch(function(){});
})();
</script>
